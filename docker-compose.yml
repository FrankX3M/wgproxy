services:
  wireguard-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wireguard-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Удаляем системные параметры ядра из контейнера, будем их настраивать на хосте
    # sysctls:
    #   - net.ipv4.ip_forward=1
    #   - net.ipv4.conf.all.src_valid_mark=1
    #   - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"  # WireGuard порт
      - "5000:5000/tcp"    # API порт
    environment:
      - WG_INTERFACE=wg0
      - WG_SERVER_PORT=51820
      - WG_SERVER_IP=10.66.66.1
      - WG_SERVER_IPV6=fd42:42:42::1
      - WG_DNS_1=1.1.1.1
      - WG_DNS_2=1.0.0.1
      - ALLOWED_IPS=0.0.0.0/0,::/0
      - API_PORT=5000
      - API_HOST=0.0.0.0
      - DEBUG=false
      - IN_DOCKER=true
    # Изменяем network_mode с "host" на "bridge" с публикацией портов
    network_mode: bridge
    healthcheck:
      test: ["CMD", "bash", "-c", "wg show wg0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Веб-интерфейс для управления
  wireguard-ui:
    image: nginx:alpine
    container_name: wireguard-ui
    restart: unless-stopped
    volumes:
      - ./ui:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - wireguard-server
    networks:
      - wgnet

networks:
  wgnet:
    driver: bridge